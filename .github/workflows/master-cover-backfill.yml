name: Full Maestro Tebeosfera sweep

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/full-sweep/commands/**.json'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: comicoteca-full-tebeosfera-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout bridge-data
        uses: actions/checkout@v6
        with:
          ref: bridge-data
          fetch-depth: 0

      - name: Checkout Maestro main
        uses: actions/checkout@v6
        with:
          ref: main
          path: _main
          fetch-depth: 1

      - name: Python dependencies
        run: pip install --quiet requests beautifulsoup4 pillow

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Wait for legacy cover writers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for N in $(seq 1 180); do
            JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=bridge-data&status=in_progress&per_page=100")
            COUNT=$(printf '%s' "$JSON" | jq --argjson self "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self) | select(.name=="Tebeosfera cover rebuild" or .name=="Tebeosfera fixed backfill" or .name=="Tebeosfera direct seed")] | length')
            if [ "$COUNT" -eq 0 ]; then
              echo 'No legacy cover writer is active'
              exit 0
            fi
            echo "Legacy cover writer still active (${COUNT}); check ${N}/180"
            sleep 20
          done
          echo 'Legacy writer did not finish within the guard window'
          exit 1

      - name: Sweep full Maestro from Tebeosfera
        shell: bash
        run: |
          set -euo pipefail
          ROUND=0
          START=$SECONDS
          while true; do
            ROUND=$((ROUND+1))
            echo "=== FULL TEBEOSFERA ROUND ${ROUND} ==="

            git pull --rebase origin bridge-data

            python master_cover_tebeosfera_full.py \
              --master _main/master-data/publishers \
              --batch 500 \
              --workers 6

            git add bridge/cache/master-cover-full-overrides.json \
                    bridge/cache/master-cover-tebeosfera-full-state.json \
                    bridge/covers

            if ! git diff --cached --quiet; then
              git commit -m "Full Tebeosfera Maestro sweep round ${ROUND}"

              PUSHED=false
              for ATTEMPT in 1 2 3 4 5 6; do
                git pull --rebase origin bridge-data
                if git push origin HEAD:bridge-data; then
                  PUSHED=true
                  break
                fi
                echo "Push race ${ATTEMPT}; rebasing and retrying"
                sleep $((ATTEMPT*2))
              done
              if [ "$PUSHED" != "true" ]; then
                echo 'Unable to publish sweep progress after retries'
                exit 1
              fi
            fi

            DONE=$(python - <<'PY'
          import json
          p='bridge/cache/master-cover-tebeosfera-full-state.json'
          d=json.load(open(p))
          print('yes' if int(d.get('passes') or 0) >= 1 else 'no')
          PY
            )
            if [ "$DONE" = "yes" ]; then
              echo 'FULL_TEBEOSFERA_PASS_COMPLETE'
              break
            fi

            if [ $((SECONDS-START)) -ge 19000 ]; then
              echo 'FULL_TEBEOSFERA_CHECKPOINT_EXIT'
              break
            fi
          done

      - name: Show sweep state
        if: always()
        run: |
          echo '--- FULL SWEEP STATE ---'
          cat bridge/cache/master-cover-tebeosfera-full-state.json 2>/dev/null || true
