name: Sync V2 pure reconciliation regression
on:
  push:
    branches: [commercial-published]
    paths:
      - 'sync-v2-reconcile.js'
      - 'sync-v2-diagnostic.js'
      - 'sync-v2-owner-restore.js'
      - 'tests/sync-v2-diagnostic.test.cjs'
      - 'tests/sync-v2-reconcile.test.cjs'
      - '.github/workflows/sync-v2-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check sync-v2-reconcile.js
          node --check sync-v2-diagnostic.js
          node --check sync-v2-owner-restore.js
          node --check tests/sync-v2-diagnostic.test.cjs
          node --check tests/sync-v2-reconcile.test.cjs
      - name: Run pure reconciliation regression tests (no cloud writes)
        run: |
          node tests/sync-v2-reconcile.test.cjs
          node tests/sync-v2-diagnostic.test.cjs
