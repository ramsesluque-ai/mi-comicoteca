name: Master identity cover backfill

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/identity-backfill/commands/**.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comicoteca-cover-overlay-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge-data
        uses: actions/checkout@v6
        with:
          ref: bridge-data
          fetch-depth: 0
      - name: Checkout Maestro main
        uses: actions/checkout@v6
        with:
          ref: main
          path: _main
          fetch-depth: 1
      - name: Python dependencies
        run: pip install --quiet requests beautifulsoup4 pillow
      - name: Read config
        id: cfg
        run: |
          CMD=$(ls -1t bridge/identity-backfill/commands/*.json 2>/dev/null | head -1)
          if [ -n "$CMD" ]; then
            BATCH=$(python -c "import json;d=json.load(open('$CMD'));print(int(d.get('batch',40)))")
            ROUNDS=$(python -c "import json;d=json.load(open('$CMD'));print(int(d.get('rounds',1)))")
          else
            BATCH=40
            ROUNDS=1
          fi
          if [ "$BATCH" -gt 60 ]; then BATCH=60; fi
          if [ "$ROUNDS" -gt 3 ]; then ROUNDS=3; fi
          if [ "$ROUNDS" -lt 1 ]; then ROUNDS=1; fi
          echo "size=$BATCH" >> "$GITHUB_OUTPUT"
          echo "rounds=$ROUNDS" >> "$GITHUB_OUTPUT"
      - name: Enrich exact identity covers
        run: |
          for i in $(seq 1 ${{ steps.cfg.outputs.rounds }}); do
            echo "=== IDENTITY RONDA $i/${{ steps.cfg.outputs.rounds }} ==="
            python master_cover_identity_backfill.py --master _main/master-data/publishers --batch ${{ steps.cfg.outputs.size }}
          done
      - name: Save overlay covers and cursor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/cache/master-cover-overrides.json bridge/cache/master-cover-identity-state.json bridge/covers
          if git diff --cached --quiet; then
            echo 'No changes in this run'
          else
            git commit -m 'Backfill por identidad fuerte de portadas del Maestro'
            git pull --rebase origin bridge-data
            git push origin bridge-data
          fi
