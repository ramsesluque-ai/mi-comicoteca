name: Sync V2 fake private cover contract
on:
  push:
    branches: [commercial-published]
    paths:
      - 'tests/sync-v2-fake-private-covers-regression.cjs'
      - 'tests/sync-v2-two-device-cover-roundtrip.test.cjs'
      - 'tests/sync-v2-two-user-cover-backend.test.cjs'
      - 'tests/sync-v2-cover-cache-bridge.test.cjs'
      - 'tests/sync-v2-private-cover-transport-isolation.test.cjs'
      - 'sync-v2-cover-cache-bridge.js'
      - 'sync-v2-cover-transport.js'
      - 'sync-v2-reconcile.js'
      - '.github/workflows/sync-v2-fake-private-covers.yml'
  workflow_dispatch:
jobs:
  fake-private-covers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic isolated cover roundtrip and fail-closed guards
        run: |
          node tests/sync-v2-fake-private-covers-regression.cjs
          node tests/sync-v2-two-device-cover-roundtrip.test.cjs
          node tests/sync-v2-two-user-cover-backend.test.cjs
          node tests/sync-v2-cover-cache-bridge.test.cjs
          node tests/sync-v2-private-cover-transport-isolation.test.cjs
