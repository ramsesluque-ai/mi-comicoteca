name: Cancel legacy cover run

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/maintenance/cancel-legacy-cover-run.json'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel legacy mixed GCD cover run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/40006377809/force-cancel" || true
          echo 'LEGACY_MIXED_GCD_COVER_RUN_FORCE_CANCEL_REQUESTED'
