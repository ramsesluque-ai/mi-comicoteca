name: Cancel legacy cover run

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/maintenance/cancel-legacy-cover-run.json'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded serial full sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/40002212434/force-cancel" || true
          echo 'SERIAL_FULL_SWEEP_FORCE_CANCEL_REQUESTED'
