name: Enrich Maestro covers by verified ISBN
on:
  workflow_dispatch:
  push:
    branches: [commercial-published]
    paths:
      - 'scripts/enrich_master_isbn_batch.py'
      - 'scripts/prepare_cover_enrichment_queue.py'
      - '.github/workflows/enrich-master-isbn.yml'
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: write
concurrency:
  group: maestro-cover-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial-published
      - name: Prepare exact ISBN queue
        run: python scripts/prepare_cover_enrichment_queue.py
      - name: Verify and link cover images in bounded batch
        run: python scripts/enrich_master_isbn_batch.py --limit 40
      - name: Commit verified results and cursor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master-data/cover-overrides.json master-data/cover-enrichment-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: enrich Maestro cover links by verified ISBN"
            git push origin HEAD:commercial-published
          fi
