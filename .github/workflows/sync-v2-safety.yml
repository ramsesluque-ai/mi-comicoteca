name: MI COMICTECA Sync V2 isolated safety gate
on:
  push:
    branches: [commercial-published]
    paths:
      - 'sync-v2-reconcile.js'
      - 'sync-v2-read-plan.js'
      - 'sync-v2-cover-integrity.js'
      - 'sync-v2-cover-transport.js'
      - 'manual-sync-v2-button.js'
      - 'cloud-migration.js'
      - 'tests/sync-v2-*.test.js'
      - 'tests/sync-v2-*.test.cjs'
      - '.github/workflows/sync-v2-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: |
          node --check sync-v2-reconcile.js
          node --check sync-v2-cover-inventory.js
          node --check sync-v2-cover-integrity.js
          node --check sync-v2-cover-transport.js
          node --check sync-v2-manual-plan.js
          node --check manual-sync-v2-button.js
          node --check cloud-migration.js
      - name: Run isolated two-device regression (no Supabase credentials)
        run: |
          node tests/sync-v2-two-device-isolated.test.js
          node tests/sync-v2-cover-inventory.test.cjs
          node tests/sync-v2-cover-integrity.test.cjs
          node tests/sync-v2-cover-transport.test.cjs
          node tests/sync-v2-cover-isolation.test.cjs
          node tests/sync-v2-manual-plan.test.cjs
      - name: Confirm legacy V1 is fail-closed
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const code = fs.readFileSync('cloud-collection-sync.js', 'utf8');
          let mutations = 0;
          const sandbox = {
            window: {},
            console: { warn() {} },
            fetch: () => { mutations++; throw Error('Unexpected V1 network call'); },
            indexedDB: { open() { mutations++; throw Error('Unexpected V1 database call'); } },
          };
          vm.runInNewContext(code, sandbox, { timeout: 1000 });
          const sync = sandbox.window.ComictecaCloudSync;
          if (!sync || sync.getStatus().ready !== false) throw Error('V1 is not paused');
          Promise.resolve(sync.sync()).then(result => {
            if (!result || result.paused !== true || mutations !== 0) throw Error('V1 is not fail-closed');
            console.log('Legacy V1 is paused; no network or database access');
          }).catch(error => { console.error(error); process.exitCode = 1; });
          NODE
