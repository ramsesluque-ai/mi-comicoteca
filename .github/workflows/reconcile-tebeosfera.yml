name: Reconcile Maestro against authorized Tebeosfera export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reference export exists
        run: |
          test -s reference-data/tebeosfera-authorized.csv || { echo "Reference CSV not provided. Obtain an authorized Tebeosfera export and add it to reference-data/tebeosfera-authorized.csv."; exit 1; }
      - name: Reconcile all publishers and issue numbers (read-only)
        run: python3 scripts/reconcile_tebeosfera.py --reference reference-data/tebeosfera-authorized.csv
      - uses: actions/upload-artifact@v4
        with:
          name: tebeosfera-reconciliation-report
          path: master-data/tebeosfera-audit/
