name: Sync V2 cover integrity (isolated)
on:
  push:
    branches: [commercial-published]
    paths:
      - 'sync-v2-cover-integrity.js'
      - 'tests/sync-v2-cover-integrity.node.test.cjs'
      - '.github/workflows/sync-v2-cover-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated binary tests (no secrets, no live writes)
        run: node --test tests/sync-v2-cover-integrity.node.test.cjs
