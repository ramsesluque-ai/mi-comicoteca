name: COMICTECA BI static smoke
on:
  push:
    branches: [commercial-published]
    paths:
      - 'index.html'
      - 'app5.js'
      - 'dashboard-pbi.js'
      - 'dashboard-pbi.css'
      - 'sw.js'
      - 'comicteca-logo-real.webp'
      - 'tests/bi-static-smoke.cjs'
      - '.github/workflows/bi-static-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/bi-static-smoke.cjs
