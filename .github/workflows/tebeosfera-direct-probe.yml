name: Tebeosfera direct probe

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/probe/**.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bridge-data
      - name: Python dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Extract exact Tebeosfera AJAX request function
        run: |
          python - <<'PY'
          import requests,re
          u='https://www.tebeosfera.com/neko/clases/NKGAL/NKgal.js'
          h={'User-Agent':'Mozilla/5.0 Chrome/153','Referer':'https://www.tebeosfera.com/'}
          t=requests.get(u,headers=h,timeout=25).text
          start=t.find('function NKgal_request_categoria')
          if start<0: raise SystemExit('FUNCTION_NOT_FOUND')
          nxt=t.find('\nfunction ',start+20)
          if nxt<0: nxt=min(len(t),start+12000)
          print('FUNCTION_START')
          print(t[start:nxt])
          print('FUNCTION_END')
          PY
