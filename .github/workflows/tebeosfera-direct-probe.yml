name: Tebeosfera direct probe

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/probe/**.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bridge-data
      - name: Python dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Probe Tebeosfera collection issue/card structure
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          target='https://www.tebeosfera.com/colecciones/blanca_1961_bruguera.html'
          h={'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9','Referer':'https://www.tebeosfera.com/'}
          r=requests.get(target,headers=h,timeout=25,allow_redirects=True)
          print('STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
          s=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in s.select('a[href*="/numeros/"]'):
            href=a.get('href') or ''
            if 'blanca_1961_bruguera_' not in href: continue
            imgs=[]
            for im in a.find_all('img'):
              src=im.get('data-src') or im.get('data-original') or im.get('data-lazy') or im.get('src') or ''
              if src: imgs.append(src)
            parent=a.parent
            pimgs=[]
            if parent:
              for im in parent.find_all('img'):
                src=im.get('data-src') or im.get('data-original') or im.get('data-lazy') or im.get('src') or ''
                if src: pimgs.append(src)
            links.append({'href':href,'text':a.get_text(' ',strip=True)[:120],'imgs':imgs[:4],'parent_imgs':pimgs[:4],'parent_html':str(parent)[:900] if parent else ''})
          print('ISSUE_LINKS',len(links))
          print(json.dumps(links[:8],ensure_ascii=False,indent=2))
          # Also print all image URLs whose nearby markup mentions this collection.
          candidates=[]
          for im in s.find_all('img'):
            src=im.get('data-src') or im.get('data-original') or im.get('data-lazy') or im.get('src') or ''
            if not src: continue
            p=str(im.parent)[:1200] if im.parent else ''
            if 'blanca_1961_bruguera_' in p:
              candidates.append({'src':src,'alt':im.get('alt') or '','parent':p[:500]})
          print('IMAGE_CANDIDATES',len(candidates))
          print(json.dumps(candidates[:8],ensure_ascii=False,indent=2))
          PY
