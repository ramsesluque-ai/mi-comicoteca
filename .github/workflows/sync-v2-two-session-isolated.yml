name: Sync V2 isolated two-session contract
on:
  push:
    branches: [commercial-published]
  workflow_dispatch:
jobs:
  isolated-two-session:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test two sessions, retries and private binary covers
        run: |
          node --test tests/sync-v2-two-session-isolated.test.mjs
          node tests/sync-v2-two-device-private-covers-harness.cjs
          node tests/sync-v2-missing-baseline-contract.cjs
          node tests/sync-v2-keyset-retry-isolation.cjs
          node tests/sync-v2-reconciliation-contract.cjs
