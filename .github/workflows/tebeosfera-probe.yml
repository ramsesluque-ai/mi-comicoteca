name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect generated advanced query format
        run: |
          python - <<'PY'
          import requests,re
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9'})
          js=S.get('https://www.tebeosfera.com/neko/js/buscador_avanzado.js',timeout=30).text
          print('LEN',len(js))
          for pat in ['div_consulta_avanzada','consulta_avanzada','innerHTML = consulta','innerHTML=consulta','ba_monta_consulta','add_sql']:
            print('\n===== PATTERN',pat,'=====')
            start=0
            count=0
            while True:
              pos=js.find(pat,start)
              if pos<0 or count>=12: break
              a=max(0,pos-1800); b=min(len(js),pos+4200)
              print('\nCTX',count,'POS',pos,'\n',js[a:b])
              start=pos+len(pat); count+=1
          PY
