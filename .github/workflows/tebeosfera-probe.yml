name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Execute exact Tebeosfera ISBN query
        run: |
          python - <<'PY'
          import requests,re,html
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          S=requests.Session(); S.headers.update({
            'User-Agent':'Mozilla/5.0 Chrome/153',
            'Accept-Language':'es-ES,es;q=0.9',
            'Referer':'https://www.tebeosfera.com/buscador-avanzado/'
          })
          isbn='9788417147648'
          consulta=(
            "id from T3_numeros WHERE ( "
            f"isbn Like '%{isbn}%' OR deposito Like '%{isbn}%' OR issn Like '%{isbn}%' OR "
            f"ean Like '%{isbn}%' OR doi Like '%{isbn}%' OR cdu Like '%{isbn}%' OR otro_registro Like '%{isbn}%' ) "
          )
          variants=[
            '<input type="hidden" value="'+consulta.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')+'" name="consulta_avanzada">',
            "<input type='hidden' value=\""+consulta+"\" name='consulta_avanzada'>",
          ]
          ep='https://www.tebeosfera.com/neko/php/ajax/buscador_avanzado_graba_consulta.php?web=1'
          for i,query in enumerate(variants,1):
            r=S.post(ep,data={'tabla':'T3_numeros','query':query,'puede_grabar_consulta':'no','asignacion_etiquetas':'no','tipo_consulta':'s','anno_dedicacion':''},timeout=30)
            token=r.text.strip()
            print('\nVARIANT',i,'SAVE',r.status_code,'TOKEN',repr(token),'QUERY',query)
            if not token: continue
            candidates=[
              f'https://www.tebeosfera.com/resultados-avanzados/{token}.html',
              f'https://www.tebeosfera.com/resultados-avanzados/{token}/',
            ]
            for u in candidates:
              rr=S.get(u,timeout=30,allow_redirects=True)
              print('RESULT',u,'STATUS',rr.status_code,'FINAL',rr.url,'LEN',len(rr.text))
              s=BeautifulSoup(rr.text,'html.parser')
              links=[]
              for a in s.select('a[href]'):
                href=urljoin(rr.url,a.get('href') or '')
                if '/numeros/' in href and href.endswith('.html') and href not in links:links.append(href)
              print('NUMBER LINKS',len(links),links[:20])
              for href in links[:20]:
                p=S.get(href,timeout=30); ps=BeautifulSoup(p.text,'html.parser')
                text=' '.join(ps.stripped_strings); compact=re.sub(r'[^0-9Xx]','',text)
                title=(ps.find('meta',attrs={'property':'og:title'}) or {}).get('content','')
                img=(ps.find('meta',attrs={'property':'og:image'}) or {}).get('content','')
                print('ITEM',href,'TITLE',title[:160],'HASISBN',isbn in compact,'IMG',img[:220])
              if links: break
          PY
