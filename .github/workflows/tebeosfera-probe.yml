name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct Tebeosfera search
        run: |
          python - <<'PY'
          import requests,re,html
          from urllib.parse import quote,urljoin
          from bs4 import BeautifulSoup
          S=requests.Session()
          S.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
            'Accept-Language':'es-ES,es;q=0.9,en;q=0.6',
          })
          def search(q):
            slug=quote(q.replace('/',' ').replace(' ','_'),safe='_:-')
            u='https://www.tebeosfera.com/buscador/'+slug+'/N%C3%BAmeros/'
            r=S.get(u,timeout=30,allow_redirects=True)
            print('\nQUERY',q,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.text))
            s=BeautifulSoup(r.text,'html.parser')
            links=[]
            for a in s.select('a[href]'):
              href=urljoin(r.url,a.get('href') or '')
              if '/numeros/' in href and href.endswith('.html') and href not in links:
                links.append(href)
            print('NUMBER LINKS',len(links))
            for href in links[:20]:
              rr=S.get(href,timeout=20)
              ss=BeautifulSoup(rr.text,'html.parser')
              title=(ss.find('meta',attrs={'property':'og:title'}) or {}).get('content','')
              img=(ss.find('meta',attrs={'property':'og:image'}) or {}).get('content','')
              text=' '.join(ss.stripped_strings)
              print('ITEM',href,'TITLE',title[:140],'IMG',img[:180],'HASISBN',('9788417147648' in re.sub(r'[^0-9Xx]','',text)))
            return links
          search('9788417147648')
          search('All-Star Batman Renacimiento')
          search('All-Star Batman 8')
          PY
