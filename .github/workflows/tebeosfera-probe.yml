name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install probe dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Probe Tebeosfera ISBN input and query
        run: |
          python - <<'PY'
          import requests,re,html
          from bs4 import BeautifulSoup
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9','X-Requested-With':'XMLHttpRequest','Referer':'https://www.tebeosfera.com/buscador-avanzado/'})
          base='https://www.tebeosfera.com/neko/php/ajax/buscador_avanzado_ajax.php'
          fields=S.get(base,params={'action':'campos','datos':'T3_numeros','contador':'1','tabla':'T3_numeros','web':'1'},timeout=30).text
          fs=BeautifulSoup(fields,'html.parser')
          wanted={}
          for o in fs.select('#select_1 option'):
            label=o.get_text(' ',strip=True)
            if label in ['ISBN / DL / DOI / ...','Título','Colección','Nº','Editorial','Año']:
              wanted[label]=o.get('value') or ''
          print('WANTED',wanted)
          for label,val in wanted.items():
            r=S.get(base,params={'action':'input','datos':val,'contador':'2','tabla':'T3_numeros','web':'1'},timeout=30)
            print('\nINPUT',label,'STATUS',r.status_code,'LEN',len(r.text))
            print(re.sub(r'\s+',' ',html.unescape(r.text))[:14000])
          PY
