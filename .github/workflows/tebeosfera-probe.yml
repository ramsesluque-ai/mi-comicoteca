name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Tebeosfera query builders
        run: |
          python - <<'PY'
          import requests,re
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9'})
          js=S.get('https://www.tebeosfera.com/neko/js/buscador_avanzado.js',timeout=30).text
          def func(name):
            p=js.find('function '+name+'(')
            if p<0:
              print('NOT FOUND',name);return
            b=js.find('{',p);depth=0;quote=None;esc=False
            for i in range(b,len(js)):
              ch=js[i]
              if quote:
                if esc:esc=False
                elif ch=='\\':esc=True
                elif ch==quote:quote=None
                continue
              if ch in ('\"',"'"):quote=ch;continue
              if ch=='{':depth+=1
              elif ch=='}':
                depth-=1
                if depth==0:
                  print('\n===== '+name+' =====\n'+js[p:i+1]);return
          for n in ['ba_monta_consulta','add_sql','ba_procesa_consulta','ba_comprueba_consulta','cargaJS']:
            func(n)
          PY
