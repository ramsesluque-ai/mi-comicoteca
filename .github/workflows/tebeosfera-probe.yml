name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Tebeosfera HTTP
        run: |
          python - <<'PY'
          import requests,re
          S=requests.Session()
          S.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
            'Accept-Language':'es-ES,es;q=0.9,en;q=0.6',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'
          })
          urls=[
            'https://www.tebeosfera.com/buscador-avanzado/',
            'https://www.tebeosfera.com/numeros/puro_peru_2019_cesal.html',
            'https://tebeosfera.com/buscador-avanzado/',
          ]
          for u in urls:
            try:
              r=S.get(u,timeout=30,allow_redirects=True)
              print('URL',u,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.text))
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',r.text,re.I|re.S)[:1])
              forms=re.findall(r'<form[^>]+action=["\']([^"\']+)',r.text,re.I)
              print('FORMS',forms[:10])
              names=re.findall(r'<(?:input|select)[^>]+name=["\']([^"\']+)',r.text,re.I)
              print('FIELDS',names[:80])
              print('HEAD',re.sub(r'\s+',' ',r.text[:1000]))
            except Exception as e:
              print('ERROR',u,repr(e))
          PY
