name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install probe dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Inspect Tebeosfera advanced search API
        run: |
          python - <<'PY'
          import requests,re
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9'})
          js=S.get('https://www.tebeosfera.com/neko/js/buscador_avanzado.js',timeout=30).text
          print('JS LEN',len(js))
          names=['ba_carga_next_div','ba_monta_consulta','ba_procesa_consulta','ba_procesa_campo','fin_de_la_consulta']
          for name in names:
            pos=js.find('function '+name)
            if pos<0: pos=js.find(name)
            print('\n===== ',name,' @ ',pos,' =====')
            if pos>=0: print(js[pos:pos+6500])
          # Probe the first dynamic step for T3_numeros using the AJAX call discovered in JS.
          base='https://www.tebeosfera.com/neko/php/ajax/'
          probes=[
            ('buscador_avanzado.php',{'action':'campos','tabla':'T3_numeros','contador':'1','datos':'T3_numeros'}),
            ('buscador_avanzado.php',{'action':'campos','tabla':'T3_numeros','contador':'1'}),
            ('buscador_avanzado_carga.php',{'action':'campos','tabla':'T3_numeros','contador':'1','datos':'T3_numeros'}),
          ]
          for ep,data in probes:
            try:
              r=S.post(base+ep+'?web=1',data=data,timeout=30,headers={'Referer':'https://www.tebeosfera.com/buscador-avanzado/','X-Requested-With':'XMLHttpRequest'})
              print('\nPOST',ep,'STATUS',r.status_code,'LEN',len(r.text),'BODY',re.sub(r'\s+',' ',r.text[:4000]))
            except Exception as e: print('ERR',ep,repr(e))
          PY
