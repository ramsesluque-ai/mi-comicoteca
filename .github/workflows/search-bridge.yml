name: Official publisher metadata lookup (no artwork)

on:
  push:
    branches: [bridge-data]
    paths:
      - 'bridge/requests/**.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comicoteca-editorial-metadata
  cancel-in-progress: false

jobs:
  lookup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v6
        with:
          ref: bridge-data
          fetch-depth: 0
      - name: Install minimal dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Official metadata, single-request only
        run: python bridge_publishers.py
      - name: Commit metadata results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/results bridge/cache
          if git diff --cached --quiet; then
            echo 'No new editorial metadata'
          else
            git commit -m 'Actualiza metadatos de fuentes editoriales'
            git pull --rebase origin bridge-data
            git push origin bridge-data
          fi
