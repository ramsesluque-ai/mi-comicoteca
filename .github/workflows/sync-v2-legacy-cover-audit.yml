name: Sync V2 legacy cover read-only audit
on:
  push:
    branches: [commercial-published]
    paths:
      - 'sync-v2-legacy-cover-audit.js'
      - 'tests/sync-v2-legacy-cover-audit.test.cjs'
      - '.github/workflows/sync-v2-legacy-cover-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-cover-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated legacy CoverVault SHA-256 audit
        run: |
          node --check sync-v2-legacy-cover-audit.js
          node --check tests/sync-v2-legacy-cover-audit.test.cjs
          node tests/sync-v2-legacy-cover-audit.test.cjs
      - name: Verify exact Cloudflare Workers asset
        env:
          BASE_URL: https://mi-comicoteca.ramsesluque.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE_URL}/sync-v2-legacy-cover-audit.js?commit=${GITHUB_SHA}" -o /tmp/legacy-cover-audit.js && cmp -s sync-v2-legacy-cover-audit.js /tmp/legacy-cover-audit.js; then
              echo "CLOUDFLARE_LEGACY_COVER_AUDIT_EXACT_ASSET_VERIFIED ${GITHUB_SHA}"
              exit 0
            fi
            sleep 15
          done
          echo "Exact Cloudflare asset not verified" >&2
          exit 1
