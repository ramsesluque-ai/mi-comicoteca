name: Export Master for Supabase

on:
  workflow_dispatch:
  pull_request:
    branches: [production-ready]
    paths:
      - 'scripts/export_master_supabase.py'
      - 'master-data/**'
      - '.github/workflows/export-master-supabase.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export deterministic Supabase batches
        run: python scripts/export_master_supabase.py
      - name: Verify manifest against canonical snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('supabase-import/manifest.json').read_text())
          summary=json.loads(Path('master-data/summary.json').read_text())
          # summary.series (5459) is the legacy source grouping. Supabase uses the
          # canonical identity Editorial+Cabecera+Volumen+Etapa+Año, which
          # intentionally separates 5792 series identities without losing issues.
          assert manifest['sourceRows']==summary['issues'], (manifest,summary)
          assert manifest['comics']==summary['issues'], (manifest,summary)
          assert manifest['comics']==160472, manifest
          assert manifest['series']==5792, manifest
          assert manifest['comics']==manifest['sourceRows'], manifest
          assert manifest['series']>=summary['series'], (manifest,summary)
          print(manifest)
          PY
      - name: Upload import batches
        uses: actions/upload-artifact@v4
        with:
          name: supabase-master-import
          path: supabase-import/
          retention-days: 7
