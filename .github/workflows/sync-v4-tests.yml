name: MI COMICTECA V4 automatic sync safety
on:
  push:
    branches: [commercial-published]
    paths:
      - 'app1.js'
      - 'vault.js'
      - 'sync-auto-v4.js'
      - 'sync-auto-covers-v4.js'
      - 'sync-auto-runtime-v4.js'
      - 'sync-v3-core.js'
      - 'sync-v2-cover-integrity.js'
      - 'tests/sync-auto-v4.test.cjs'
      - 'tests/sync-auto-v4-e2e.test.cjs'
      - 'tests/sync-auto-runtime-v4.test.cjs'
      - 'tests/sync-auto-covers-v4.test.cjs'
      - '.github/workflows/sync-v4-tests.yml'
  workflow_dispatch:
jobs:
  safe-automatic-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Automatic sync, optimistic conflict and private cover tests
        run: node --test tests/sync-auto-v4.test.cjs tests/sync-auto-v4-e2e.test.cjs tests/sync-auto-runtime-v4.test.cjs tests/sync-auto-covers-v4.test.cjs
