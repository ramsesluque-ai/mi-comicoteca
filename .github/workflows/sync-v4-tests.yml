name: MI COMICTECA V4 automatic sync safety
on:
  push:
    branches: [commercial-published]
    paths:
      - 'app1.js'
      - 'app5.js'
      - 'index.html'
      - 'sw.js'
      - 'manual-sync-v2-button.js'
      - 'catalog-cloud-rehydrate.js'
      - 'vault.js'
      - 'sync-auto-v4.js'
      - 'sync-auto-covers-v4.js'
      - 'sync-auto-runtime-v4.js'
      - 'sync-v3-core.js'
      - 'sync-v2-cover-integrity.js'
      - 'tests/sync-auto-v4.test.cjs'
      - 'tests/sync-auto-v4-e2e.test.cjs'
      - 'tests/sync-auto-runtime-v4.test.cjs'
      - 'tests/sync-auto-covers-v4.test.cjs'
      - '.github/workflows/sync-v4-tests.yml'
  workflow_dispatch:
jobs:
  safe-automatic-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V4 core optimistic sync tests
        run: node --test tests/sync-auto-v4.test.cjs
      - name: V4 two-device simulated E2E tests
        if: success() || failure()
        run: node --test tests/sync-auto-v4-e2e.test.cjs
      - name: V4 runtime and retry tests
        if: success() || failure()
        run: node --test tests/sync-auto-runtime-v4.test.cjs
      - name: V4 private cover binary tests
        if: success() || failure()
        run: node --test tests/sync-auto-covers-v4.test.cjs
