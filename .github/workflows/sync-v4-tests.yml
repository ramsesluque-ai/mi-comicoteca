name: MI COMICTECA V4 automatic sync safety
on:
  push:
    branches: [commercial-published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-automatic-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation for production sync modules
        run: |
          node --check app1.js
          node --check app5.js
          node --check vault.js
          node --check sync-v3-core.js
          node --check sync-auto-v4.js
          node --check sync-auto-covers-v4.js
          node --check sync-auto-runtime-v4.js
          node --check manual-sync-v2-button.js
          node --check tests/sync-auto-v4.test.cjs
          node --check tests/sync-auto-v4-e2e.test.cjs
          node --check tests/sync-auto-covers-v4.test.cjs
          node --check tests/sync-auto-runtime-v4.test.cjs
          node --check tests/sync-delete-v4-sql.test.cjs
      - name: Enforce closed production release gate until real two-user E2E
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('sync-auto-runtime-v4.js','utf8');if(!/const RELEASE_APPROVED=false\s*;/.test(s)){console.error('Unsafe sync V4 release gate');process.exit(1)}"
      - name: V4 tombstone SQL safety contract
        run: node --test tests/sync-delete-v4-sql.test.cjs
      - name: V4 core optimistic sync tests
        run: node --test tests/sync-auto-v4.test.cjs
      - name: V4 two-device simulated E2E tests
        if: success() || failure()
        run: node --test tests/sync-auto-v4-e2e.test.cjs
      - name: V4 runtime and retry tests
        if: success() || failure()
        run: node --test tests/sync-auto-runtime-v4.test.cjs
      - name: V4 private cover binary tests
        if: success() || failure()
        run: node --test tests/sync-auto-covers-v4.test.cjs

      - name: Maestro selected-cover transfer regression
        if: success() || failure()
        run: node --test tests/master-selected-cover-transfer.test.cjs
