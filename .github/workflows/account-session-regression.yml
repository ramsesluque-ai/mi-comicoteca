name: Account session and catalog visibility regression
on:
  push:
    branches:
      - commercial-published
    paths:
      - 'app1.js'
      - 'commercial-billing.js'
      - 'account-storage-diagnostic.js'
      - 'index.html'
      - 'tests/account-session-regression.test.cjs'
      - 'catalog-cloud-rehydrate.js'
      - 'tests/catalog-cloud-rehydrate.test.cjs'
      - 'app5.js'
      - 'sw.js'
      - '.github/workflows/account-session-regression.yml'
  workflow_dispatch:
jobs:
  account-session:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app1.js
          node --check commercial-billing.js
          node --check account-storage-diagnostic.js
          node --check app5.js
          node --check catalog-cloud-rehydrate.js
          node --check sw.js
      - name: Run local account-session regression tests
        run: node --test tests/account-session-regression.test.cjs tests/catalog-cloud-rehydrate.test.cjs
