name: Tebeosfera probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tebeosfera-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Inspect publication result markup
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'es-ES,es;q=0.9','Referer':'https://www.tebeosfera.com/buscador-avanzado/'})
          S.get('https://www.tebeosfera.com/buscador-avanzado/',timeout=30)
          ep='https://www.tebeosfera.com/neko/php/ajax/buscador_avanzado_graba_consulta.php?web=1'
          q=("id from T3_publicaciones WHERE (titulo LIKE '%Batman%' || facial LIKE '%Batman%' || antetitulo LIKE '%Batman%' || subtitulo LIKE '%Batman%' || acreditado LIKE '%Batman%' || alternativo LIKE '%Batman%' ) ")
          r=S.post(ep,data={'tabla':'T3_publicaciones','query':q,'puede_grabar_consulta':'no','asignacion_etiquetas':'no','tipo_consulta':'s','anno_dedicacion':''},timeout=30)
          token=r.text.strip();print('TOKEN',repr(token))
          rr=S.get(f'https://www.tebeosfera.com/resultados-avanzados/{token}.html',timeout=30,allow_redirects=True)
          print('RESULT',rr.status_code,rr.url,'LEN',len(rr.text))
          soup=BeautifulSoup(rr.text,'html.parser')
          print('ANCHORS')
          for i,a in enumerate(soup.select('a[href]')[:160]):
            print(i,repr((a.get_text(' ',strip=True) or '')[:120]),repr(urljoin(rr.url,a.get('href') or '')))
          print('ONCLICKS')
          for i,e in enumerate(soup.select('[onclick]')[:80]):
            print(i,repr((e.get_text(' ',strip=True) or '')[:80]),repr(e.get('onclick')))
          print('INPUTS')
          for i,e in enumerate(soup.select('input')[:80]):
            print(i,e.get('name'),e.get('id'),e.get('value'))
          txt=rr.text
          for pat in [r'FICHA_REG_ID[^<]{0,100}',r'T3_publicaciones[^<]{0,160}',r'publicacion[^<]{0,160}',r'BATMAN[^<]{0,180}']:
            vals=re.findall(pat,txt,re.I)
            print('PATTERN',pat,'COUNT',len(vals));print('\n'.join(vals[:40]))
          PY
